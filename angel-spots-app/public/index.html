<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Illegale Angel-Spots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08090d;
    --panel: #12141b;
    --panel-2: #181b24;
    --border: #232733;
    --border-soft: #1a1d27;
    --input-bg: #0d0f15;
    --text: #f3f4f7;
    --text-dim: #8890a3;
    --text-faint: #565c6d;
    --accent: #ff4757;
    --accent-hover: #ff5f6d;
    --accent-soft: rgba(255,71,87,.12);
    --gold: #f2b705;
    --gold-soft: rgba(242,183,5,.14);
    --success: #2ecc71;
    --success-soft: rgba(46,204,113,.12);
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: "Rajdhani", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,71,87,0.10), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 20%, rgba(242,183,5,0.05), transparent 60%);
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
  ::selection{ background: var(--accent-soft); color: var(--text); }
  *:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 36px 18px 70px;
  }

  .eyebrow{
    font-family: var(--font-display);
    color: var(--accent);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before{
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    flex-shrink: 0;
  }
  h1{
    font-family: var(--font-display);
    font-size: 30px;
    margin: 0 0 22px 0;
    font-weight: 700;
    letter-spacing: .3px;
  }

  /* --- Karten mit HUD-Ecken-Signatur --- */
  .card, .spot{
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card::before, .card::after,
  .spot::before, .spot::after{
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    pointer-events: none;
    opacity: .5;
  }
  .card::before, .spot::before{
    top: -1px; left: -1px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
    border-top-left-radius: 6px;
  }
  .card::after, .spot::after{
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    border-bottom-right-radius: 6px;
  }

  .card-title{
    font-family: var(--font-display);
    display:flex;
    align-items:center;
    gap:8px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .3px;
    margin-bottom: 18px;
    color: var(--text);
    text-transform: uppercase;
  }
  .card-title .plus{
    color: var(--accent);
    font-weight: 800;
  }

  input{
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font-body);
    padding: 12px 14px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{ color: var(--text-faint); }
  input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .row2{
    display:flex;
    gap: 12px;
  }
  .row2 input{ flex:1; margin-bottom: 0; }
  .row2{ margin-bottom: 12px; }

  button.save{
    width: 100%;
    background: var(--accent);
    border: none;
    color: white;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: background .15s ease, transform .1s ease;
    margin-top: 4px;
  }
  button.save:hover{ background: var(--accent-hover); }
  button.save:active{ transform: scale(.98); }

  .spot{ padding: 20px 22px; margin-bottom: 14px; }
  .spot-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  .spot-name{
    font-family: var(--font-display);
    display:flex;
    align-items:center;
    gap:8px;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .4px;
    text-transform: uppercase;
  }
  .del{
    background: var(--accent-soft);
    border: 1px solid rgba(255,71,87,.25);
    color: var(--accent);
    border-radius: var(--radius-sm);
    width: 32px;
    height: 32px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  .del:hover{ background: rgba(255,71,87,.22); border-color: rgba(255,71,87,.45); }
  .del.small{
    width: 28px;
    height: 28px;
    font-size: 12px;
  }
  .stat{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    padding: 7px 0;
  }
  .stat-label{
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: .3px;
  }
  .stat-value{
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
  }

  .fish-section{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
  }
  .fish-label{
    font-family: var(--font-display);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .fish-item{
    display:flex;
    align-items:center;
    justify-content: space-between;
    background: var(--panel-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 10px 13px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .fish-item .fname{ font-weight: 600; font-family: var(--font-body); }
  .fish-item .fpercent{ color: var(--accent); font-weight: 700; font-family: var(--font-mono); }
  .fish-item .ftime{ color: var(--text-dim); margin-left: 10px; font-size: 12px; font-family: var(--font-mono); }
  .fish-item-left{ display:flex; align-items:baseline; gap: 4px; flex-wrap: wrap; }
  .fish-empty{
    color: var(--text-faint);
    font-size: 13px;
    margin-bottom: 10px;
    font-style: italic;
  }
  .fish-add-row{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .fish-add-row input{
    margin-bottom: 0;
    font-size: 13px;
    padding: 10px 12px;
  }
  .fish-add-row .fname-input{ flex: 1 1 100%; }
  .fish-add-row .fpercent-input{ flex: 1 1 calc(50% - 44px); min-width: 90px; }
  .fish-add-row .ftime-input{ flex: 1 1 calc(50% - 44px); min-width: 90px; }
  .fish-add-btn{
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
    width: 42px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s ease;
  }
  .fish-add-btn:hover{ background: var(--accent-hover); }

  .empty{
    text-align:center;
    color: var(--text-faint);
    font-size: 14px;
    padding: 34px 0;
    font-style: italic;
  }
  .toast{
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity: 1; }

  .lock-screen{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  .lock-box{
    position: relative;
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    text-align:center;
  }
  .lock-box::before, .lock-box::after{
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    opacity: .6;
  }
  .lock-box::before{
    top: -1px; left: -1px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
    border-top-left-radius: 6px;
  }
  .lock-box::after{
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    border-bottom-right-radius: 6px;
  }
  .lock-icon{ font-size: 30px; margin-bottom: 12px; }
  .lock-title{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .lock-sub{ color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .lock-error{
    color: var(--accent);
    font-size: 12px;
    min-height: 16px;
    margin: -6px 0 8px;
  }
  .hidden{ display: none !important; }

  .map-upload-label{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width: 100%;
    background: var(--input-bg);
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    padding: 13px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    transition: border-color .15s ease, color .15s ease;
  }
  .map-upload-label:hover{ border-color: var(--accent); color: var(--text); }
  .map-upload-label input[type="file"]{ display:none; }

  .map-preview{
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    display: block;
  }

  .map-section{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
  }
  .map-label{
    font-family: var(--font-display);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .map-img-wrap{
    position: relative;
    border-radius: var(--radius-sm);
    overflow: hidden;
    cursor: zoom-in;
    border: 1px solid var(--border-soft);
  }
  .map-img-wrap img{
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display:block;
  }
  .map-remove{
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(8,9,13,.8);
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 7px;
    width: 28px;
    height: 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    font-size: 12px;
    backdrop-filter: blur(4px);
  }
  .map-remove:hover{ background: rgba(255,71,87,.2); }
  .map-upload-small{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width: 100%;
    background: var(--input-bg);
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    padding: 15px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .map-upload-small:hover{ border-color: var(--accent); color: var(--text); }
  .map-upload-small input[type="file"]{ display:none; }

  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(4,5,8,.9);
    backdrop-filter: blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 100;
    cursor: zoom-out;
  }
  .lightbox img{
    max-width: 100%;
    max-height: 100%;
    border-radius: var(--radius-sm);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }

  /* --- Preisliste --- */
  .price-item{
    display:flex;
    align-items:center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    margin-bottom: 9px;
    transition: border-left-color .2s ease;
  }
  .price-item.fresh{ border-left-color: var(--success); }
  .price-item.aging{ border-left-color: var(--gold); }
  .price-item.stale{ border-left-color: var(--accent); }

  .price-drag-handle{
    color: var(--text-faint);
    font-size: 18px;
    line-height: 1;
    padding: 4px 10px 4px 0;
    cursor: grab;
    flex-shrink: 0;
    touch-action: none;
    user-select: none;
    transition: color .15s ease;
  }
  .price-drag-handle:hover{ color: var(--text-dim); }
  .price-drag-handle:active{ cursor: grabbing; }
  .price-item-ghost{ opacity: 0.35; }
  .price-item-dragging{ box-shadow: 0 8px 24px rgba(255,71,87,.3); }

  .price-info{ display:flex; flex-direction:column; gap: 4px; }
  .price-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight: 600;
    font-size: 14px;
    font-family: var(--font-body);
  }
  .price-meta{
    font-size: 11px;
    color: var(--text-faint);
    display:flex;
    align-items:center;
    gap: 6px;
    font-family: var(--font-mono);
  }
  .price-dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display:inline-block;
    flex-shrink: 0;
  }
  .price-dot.fresh{ background: var(--success); box-shadow: 0 0 6px var(--success); }
  .price-dot.aging{ background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .price-dot.stale{ background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .price-value-wrap{
    display:flex;
    align-items:baseline;
    gap: 7px;
  }
  .price-value{
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--accent);
    font-size: 15px;
  }
  .price-trend{
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
  }
  .price-trend.up{ color: #ff6b6b; }
  .price-trend.down{ color: var(--success); }
  .price-prev{
    font-size: 11px;
    color: var(--text-faint);
    text-decoration: line-through;
    font-family: var(--font-mono);
  }
  .price-row-right{
    display:flex;
    align-items:center;
    gap: 7px;
  }
  .price-action-btn{
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    width: 30px;
    height: 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
    transition: border-color .15s ease;
  }
  .price-action-btn:hover{ border-color: var(--accent); }
  .price-action-btn.confirm:hover{ border-color: var(--success); }

  /* --- Tabs --- */
  .tabs{
    display:flex;
    gap: 4px;
    margin-bottom: 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
  }
  .tab-btn{
    flex: 1;
    font-family: var(--font-display);
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .8px;
    text-transform: uppercase;
    padding: 11px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn:hover{ color: var(--text); }
  .tab-btn.active{
    background: var(--accent);
    color: white;
  }
  .tab-panel{ display: none; }
  .tab-panel.active{ display: block; }

  /* --- Goldene Stunde: Broadcast-Alert-Stil --- */
  .gold-banner{
    position: relative;
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    margin-bottom: 22px;
    color: var(--text);
    overflow: hidden;
  }
  .gold-banner::before{
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 40%, rgba(242,183,5,.08) 50%, transparent 60%);
    background-size: 220% 100%;
  }
  .gold-banner.active{
    border-left-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(242,183,5,.15), 0 0 20px rgba(242,183,5,.15);
  }
  .gold-banner.active::before{
    animation: goldScan 3s linear infinite;
  }
  .gold-banner.active .gold-banner-icon{
    animation: goldPulse 1.6s ease-in-out infinite;
  }
  @keyframes goldPulse{
    0%, 100%{ opacity: 1; transform: scale(1); }
    50%{ opacity: .6; transform: scale(.85); }
  }
  @keyframes goldScan{
    0%{ background-position: -120% 0; }
    100%{ background-position: 120% 0; }
  }
  .gold-banner-icon{
    font-size: 18px;
    flex-shrink: 0;
    color: var(--gold);
    position: relative;
    z-index: 1;
  }
  .gold-banner-text{
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    position: relative;
    z-index: 1;
  }
  .gold-banner-text strong{
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: .3px;
    color: var(--gold);
    text-transform: uppercase;
  }

  /* --- Bild-Import (OCR) --- */
  .ocr-upload-label{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width: 100%;
    background: var(--input-bg);
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    padding: 15px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .ocr-upload-label:hover{ border-color: var(--accent); color: var(--text); }
  .ocr-upload-label input[type="file"]{ display:none; }

  .ocr-status{
    text-align:center;
    font-size: 13px;
    color: var(--text-dim);
    padding: 10px 0;
    font-weight: 600;
    font-family: var(--font-mono);
  }

  .ocr-review-list{ margin-top: 14px; }
  .ocr-review-item{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .ocr-review-item input{
    margin-bottom: 0;
    font-size: 13px;
    padding: 10px 12px;
  }
  .ocr-name-input{ flex: 1.6; }
  .ocr-price-input{ flex: 1; }

  .ocr-review-actions{
    display:flex;
    gap: 10px;
    margin-top: 14px;
  }
  .ocr-review-actions button{
    flex: 1;
    font-family: var(--font-display);
    letter-spacing: .5px;
    text-transform: uppercase;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .ocr-apply-btn{ background: var(--accent); color: white; }
  .ocr-apply-btn:hover{ background: var(--accent-hover); }

<script>
const API = '/api/spots';

const nameEl = document.getElementById('name');
const levelEl = document.getElementById('level');
const timeEl = document.getElementById('time');
const goldenEl = document.getElementById('golden');
const saveBtn = document.getElementById('saveBtn');
const listEl = document.getElementById('list');
const toastEl = document.getElementById('toast');
const mapInput = document.getElementById('mapInput');
const mapPreview = document.getElementById('mapPreview');
const mapUploadText = document.getElementById('mapUploadText');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

let spots = [];
let pendingMapImage = null;

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1800);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

mapInput.addEventListener('change', async () => {
  const file = mapInput.files[0];
  if(!file) return;
  try{
    pendingMapImage = await readFileAsDataUrl(file);
    mapPreview.src = pendingMapImage;
    mapPreview.classList.remove('hidden');
    mapUploadText.textContent = '🗺️ Bild ausgewählt — Klicken zum Ändern';
  }catch(e){
    showToast('Bild konnte nicht geladen werden');
  }
});

function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.remove('hidden');
}
lightbox.addEventListener('click', () => {
  lightbox.classList.add('hidden');
  lightboxImg.src = '';
});

// --- Goldene Stunde: Berechnung & Anzeige ---
const goldBanner = document.getElementById('goldBanner');
const goldBannerText = document.getElementById('goldBannerText');

// Extrahiert Start-/Endzeit aus Texten wie "02 - 03 Uhr" oder "22:30 - 23:00"
function parseGoldenWindow(str){
  if(!str) return null;
  const matches = str.match(/(\d{1,2})(?::(\d{2}))?/g);
  if(!matches || matches.length < 2) return null;
  const parseTok = (tok) => {
    const parts = tok.split(':');
    const h = parseInt(parts[0], 10) % 24;
    const m = parts[1] ? parseInt(parts[1], 10) : 0;
    if(isNaN(h) || isNaN(m)) return null;
    return { h, m };
  };
  const start = parseTok(matches[0]);
  const end = parseTok(matches[1]);
  if(!start || !end) return null;
  return { startH: start.h, startM: start.m, endH: end.h, endM: end.m };
}

function formatWindow(win){
  const pad = n => String(n).padStart(2, '0');
  return `${pad(win.startH)}:${pad(win.startM)} - ${pad(win.endH)}:${pad(win.endM)} Uhr`;
}

function formatMinutes(mins){
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}min` : `${m}min`;
}

function updateGoldBanner(){
  if(!spots || spots.length === 0){
    goldBanner.classList.add('hidden');
    return;
  }

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const activeSpots = [];
  const upcoming = [];

  spots.forEach(spot => {
    const win = parseGoldenWindow(spot.golden);
    if(!win) return;

    const startMin = win.startH * 60 + win.startM;
    const endMin = win.endH * 60 + win.endM;
    const wrapsMidnight = endMin <= startMin;

    let isActive = false;
    let minutesUntilEnd = 0;
    let minutesUntilStart = 0;

    if(wrapsMidnight){
      isActive = nowMin >= startMin || nowMin < endMin;
      if(isActive){
        minutesUntilEnd = nowMin >= startMin ? (endMin + 1440 - nowMin) : (endMin - nowMin);
      }else{
        minutesUntilStart = startMin - nowMin;
        if(minutesUntilStart < 0) minutesUntilStart += 1440;
      }
    }else{
      isActive = nowMin >= startMin && nowMin < endMin;
      if(isActive){
        minutesUntilEnd = endMin - nowMin;
      }else{
        minutesUntilStart = startMin - nowMin;
        if(minutesUntilStart < 0) minutesUntilStart += 1440;
      }
    }

    if(isActive){
      activeSpots.push({ spot, minutesUntilEnd });
    }else{
      upcoming.push({ spot, minutesUntilStart, win });
    }
  });

  if(activeSpots.length > 0){
    goldBanner.classList.remove('hidden');
    goldBanner.classList.add('active');
    const names = activeSpots.map(a => escapeHtml(a.spot.name)).join(', ');
    const soonestEnd = Math.min(...activeSpots.map(a => a.minutesUntilEnd));
    goldBannerText.innerHTML = `<strong>🌟 GOLDENE STUNDE AKTIV:</strong> ${names} — noch ${formatMinutes(soonestEnd)}`;
  }else if(upcoming.length > 0){
    goldBanner.classList.remove('hidden');
    goldBanner.classList.remove('active');
    upcoming.sort((a, b) => a.minutesUntilStart - b.minutesUntilStart);
    const next = upcoming[0];
    goldBannerText.innerHTML = `<strong>⏳ Nächste Goldene Stunde:</strong> ${escapeHtml(next.spot.name)} in ${formatMinutes(next.minutesUntilStart)} (${formatWindow(next.win)})`;
  }else{
    goldBanner.classList.add('hidden');
  }
}

// Timer alle 30 Sekunden aktualisieren (ohne neu vom Server zu laden)
setInterval(updateGoldBanner, 30000);

// --- API-Kommunikation ---
async function loadSpots(){
  try{
    const res = await fetch(API);
    spots = await res.json();
  }catch(e){
    showToast('Server nicht erreichbar');
    spots = [];
  }
  render();
  updateGoldBanner();
}

async function createSpot(payload){
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function deleteSpot(id){
  await fetch(`${API}/${id}`, { method: 'DELETE' });
}

async function setSpotMap(id, mapImage){
  await fetch(`${API}/${id}/map`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mapImage })
  });
}

async function addFish(spotId, name, time, percent){
  await fetch(`${API}/${spotId}/fish`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, time, percent })
  });
}

async function deleteFish(spotId, fishId){
  await fetch(`${API}/${spotId}/fish/${fishId}`, { method: 'DELETE' });
}

// --- Rendering ---
function render(){
  listEl.innerHTML = '';
  if(spots.length === 0){
    listEl.innerHTML = '<div class="empty">Noch keine Spots eingetragen.</div>';
    return;
  }

  spots.forEach(spot => {
    const div = document.createElement('div');
    div.className = 'spot';

    const formatPercent = (val) => {
      if(!val) return '';
      const num = parseFloat(String(val).replace(',', '.').replace('%', ''));
      if(isNaN(num)) return escapeHtml(val);
      return num.toFixed(2).replace('.', ',') + ' %';
    };

    const fishItemsHtml = spot.fish.length === 0
      ? '<div class="fish-empty">Noch keine Fische eingetragen.</div>'
      : spot.fish.map(f => `
          <div class="fish-item">
            <div class="fish-item-left">
              <span class="fname">${escapeHtml(f.name)}</span>
              ${f.percent ? `<span class="fpercent"> - ${formatPercent(f.percent)}</span>` : ''}
              ${f.time ? `<span class="ftime">${escapeHtml(f.time)}</span>` : ''}
            </div>
            <div class="del small" data-spot="${spot.id}" data-fish="${f.id}">🗑</div>
          </div>
        `).join('');

    const mapHtml = spot.mapImage
      ? `<div class="map-img-wrap" data-view-map="${spot.id}">
           <img src="${spot.mapImage}" />
           <div class="map-remove" data-remove-map="${spot.id}">🗑</div>
         </div>`
      : `<label class="map-upload-small">
           🗺️ Karte hinzufügen
           <input type="file" accept="image/*" data-addmap="${spot.id}" />
         </label>`;

    div.innerHTML = `
      <div class="spot-head">
        <div class="spot-name">🐟 ${escapeHtml(spot.name).toUpperCase()}</div>
        <div class="del" data-id="${spot.id}">🗑</div>
      </div>
      <div class="stat"><span class="stat-label">Level-Bereich</span><span class="stat-value">${escapeHtml(spot.level)}</span></div>
      <div class="stat"><span class="stat-label">Uhrzeit</span><span class="stat-value">${escapeHtml(spot.time)}</span></div>
      <div class="stat"><span class="stat-label">Goldene Stunde</span><span class="stat-value">${escapeHtml(spot.golden)}</span></div>

      <div class="map-section">
        <div class="map-label">🗺️ GTA5-Karte</div>
        ${mapHtml}
      </div>

      <div class="fish-section">
        <div class="fish-label">🐠 Fische</div>
        ${fishItemsHtml}
        <div class="fish-add-row">
          <input class="fname-input" placeholder="Fisch (z. B. Barsch)" data-fname="${spot.id}" />
          <input class="fpercent-input" placeholder="Prozent (z. B. 16,13%)" data-fpercent="${spot.id}" />
          <input class="ftime-input" placeholder="Zeit (optional)" data-ftime="${spot.id}" />
          <button class="fish-add-btn" data-addfish="${spot.id}">+</button>
        </div>
      </div>
    `;
    listEl.appendChild(div);
  });

  // Spot löschen
  document.querySelectorAll('.del[data-id]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.currentTarget.getAttribute('data-id');
      await deleteSpot(id);
      await loadSpots();
      showToast('Spot gelöscht');
    });
  });

  // Fisch löschen
  document.querySelectorAll('.del[data-fish]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const spotId = e.currentTarget.getAttribute('data-spot');
      const fishId = e.currentTarget.getAttribute('data-fish');
      await deleteFish(spotId, fishId);
      await loadSpots();
      showToast('Fisch gelöscht');
    });
  });

  // Fisch hinzufügen
  document.querySelectorAll('[data-addfish]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const spotId = e.currentTarget.getAttribute('data-addfish');
      const fnameInput = document.querySelector(`[data-fname="${spotId}"]`);
      const fpercentInput = document.querySelector(`[data-fpercent="${spotId}"]`);
      const ftimeInput = document.querySelector(`[data-ftime="${spotId}"]`);
      const fname = fnameInput.value.trim();
      const fpercent = fpercentInput.value.trim();
      const ftime = ftimeInput.value.trim();

      if(!fname){
        fnameInput.focus();
        showToast('Bitte Fisch-Namen eingeben');
        return;
      }

      await addFish(spotId, fname, ftime, fpercent);
      await loadSpots();
      showToast('Fisch gespeichert');
    });
  });

  // Kartenbild bei bestehendem Spot hinzufügen
  document.querySelectorAll('[data-addmap]').forEach(input => {
    input.addEventListener('change', async (e) => {
      const spotId = e.currentTarget.getAttribute('data-addmap');
      const file = e.currentTarget.files[0];
      if(!file) return;
      try{
        const dataUrl = await readFileAsDataUrl(file);
        await setSpotMap(spotId, dataUrl);
        await loadSpots();
        showToast('Karte gespeichert');
      }catch(err){
        showToast('Bild konnte nicht geladen werden');
      }
    });
  });

  // Kartenbild entfernen
  document.querySelectorAll('[data-remove-map]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const spotId = e.currentTarget.getAttribute('data-remove-map');
      await setSpotMap(spotId, null);
      await loadSpots();
      showToast('Karte entfernt');
    });
  });

  // Kartenbild vergrößern
  document.querySelectorAll('[data-view-map]').forEach(wrap => {
    wrap.addEventListener('click', (e) => {
      const img = wrap.querySelector('img');
      if(img) openLightbox(img.src);
    });
  });
}

saveBtn.addEventListener('click', async () => {
  const name = nameEl.value.trim();
  const level = levelEl.value.trim();
  const time = timeEl.value.trim();
  const golden = goldenEl.value.trim();

  if(!name){
    nameEl.focus();
    showToast('Bitte Spot-Namen eingeben');
    return;
  }

  await createSpot({ name, level, time, golden, mapImage: pendingMapImage });

  nameEl.value = '';
  levelEl.value = '';
  timeEl.value = '';
  goldenEl.value = '';
  mapInput.value = '';
  pendingMapImage = null;
  mapPreview.classList.add('hidden');
  mapPreview.src = '';
  mapUploadText.textContent = '🗺️ GTA5-Karte hinzufügen (optional)';

  await loadSpots();
  showToast('Spot gespeichert');
});

// --- Preisliste ---
const PRICE_API = '/api/prices';
const priceNameEl = document.getElementById('priceName');
const priceValueEl = document.getElementById('priceValue');
const priceSaveBtn = document.getElementById('priceSaveBtn');
const priceListEl = document.getElementById('priceList');
let prices = [];

async function loadPrices(){
  try{
    const res = await fetch(PRICE_API);
    prices = await res.json();
  }catch(e){
    prices = [];
  }
  renderPrices();
}

async function createPriceEntry(name, price){
  await fetch(PRICE_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, price })
  });
}

async function updatePriceValue(id, price){
  await fetch(`${PRICE_API}/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ price })
  });
}

// Formatiert einen Zeitpunkt relativ zu jetzt (z. B. "vor 5 Min.")
function formatRelativeTime(ts){
  if(!ts) return 'unbekannt';
  const diffMs = Date.now() - ts;
  const diffMin = Math.floor(diffMs / 60000);
  if(diffMin < 1) return 'gerade eben';
  if(diffMin < 60) return `vor ${diffMin} Min.`;
  const diffH = Math.floor(diffMin / 60);
  if(diffH < 24) return `vor ${diffH} Std.`;
  const diffD = Math.floor(diffH / 24);
  return `vor ${diffD} Tag${diffD === 1 ? '' : 'en'}`;
}

// Bestimmt Alterskategorie für Farbcodierung
function priceAgeClass(ts){
  if(!ts) return 'stale';
  const diffMs = Date.now() - ts;
  const oneHour = 60 * 60 * 1000;
  const oneDay = 24 * oneHour;
  if(diffMs < oneHour) return 'fresh';
  if(diffMs < oneDay) return 'aging';
  return 'stale';
}

function parsePriceNumber(val){
  if(val === null || val === undefined) return NaN;
  return parseFloat(String(val).replace(',', '.').replace(/[^0-9.\-]/g, ''));
}

function renderPrices(){
  priceListEl.innerHTML = '';
  if(prices.length === 0){
    priceListEl.innerHTML = '<div class="empty">Noch keine Preise eingetragen.</div>';
    return;
  }
  prices.forEach(p => {
    const div = document.createElement('div');
    const ageClass = priceAgeClass(p.updatedAt);
    div.className = `price-item ${ageClass}`;
    div.setAttribute('data-id', p.id);

    let trendHtml = '';
    if(p.previousPrice){
      const oldNum = parsePriceNumber(p.previousPrice);
      const newNum = parsePriceNumber(p.price);
      if(!isNaN(oldNum) && !isNaN(newNum) && oldNum !== newNum){
        const isUp = newNum > oldNum;
        trendHtml = `
          <span class="price-trend ${isUp ? 'up' : 'down'}">${isUp ? '↑' : '↓'}</span>
          <span class="price-prev">${escapeHtml(p.previousPrice)}</span>
        `;
      }
    }

    div.innerHTML = `
      <div class="price-drag-handle" title="Ziehen zum Umsortieren">⠿</div>
      <div class="price-info">
        <div class="price-name">🐟 ${escapeHtml(p.name)}</div>
        <div class="price-meta">
          <span class="price-dot ${ageClass}"></span>
          ${formatRelativeTime(p.updatedAt)}
        </div>
      </div>
      <div class="price-row-right">
        <div class="price-value-wrap">
          <div class="price-value">${escapeHtml(p.price)}</div>
          ${trendHtml}
        </div>
        <div class="price-action-btn confirm" data-confirm-id="${p.id}" title="Preis bestätigen">✓</div>
        <div class="price-action-btn" data-edit-id="${p.id}" title="Preis bearbeiten">✏️</div>
        <div class="price-action-btn" data-priceid="${p.id}" title="Löschen">🗑</div>
      </div>
    `;
    priceListEl.appendChild(div);
  });

  initPriceSorting();

  // Löschen
  document.querySelectorAll('[data-priceid]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.currentTarget.getAttribute('data-priceid');
      await fetch(`${PRICE_API}/${id}`, { method: 'DELETE' });
      await loadPrices();
      showToast('Preis gelöscht');
    });
  });

  // Bestätigen (nur Zeitstempel auffrischen)
  document.querySelectorAll('[data-confirm-id]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.currentTarget.getAttribute('data-confirm-id');
      await fetch(`${PRICE_API}/${id}/confirm`, { method: 'PUT' });
      await loadPrices();
      showToast('Preis bestätigt');
    });
  });

  // Bearbeiten
  document.querySelectorAll('[data-edit-id]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.currentTarget.getAttribute('data-edit-id');
      const current = prices.find(p => String(p.id) === String(id));
      const input = prompt('Neuer Preis:', current ? current.price : '');
      if(input === null) return; // abgebrochen
      const trimmed = input.trim();
      if(!trimmed){
        showToast('Preis darf nicht leer sein');
        return;
      }
      await updatePriceValue(id, trimmed);
      await loadPrices();
      showToast('Preis aktualisiert');
    });
  });
}

// Zeitstempel-Anzeigen automatisch alle 60 Sekunden auffrischen
setInterval(() => { if(prices.length > 0) renderPrices(); }, 60000);

// --- Drag & Drop zum manuellen Umsortieren der Preisliste ---
let priceSortableInstance = null;

function initPriceSorting(){
  if(priceSortableInstance){
    priceSortableInstance.destroy();
    priceSortableInstance = null;
  }
  if(typeof Sortable === 'undefined' || prices.length === 0) return;

  priceSortableInstance = Sortable.create(priceListEl, {
    handle: '.price-drag-handle',
    animation: 150,
    ghostClass: 'price-item-ghost',
    dragClass: 'price-item-dragging',
    onEnd: async () => {
      const newOrder = Array.from(priceListEl.querySelectorAll('.price-item'))
        .map(el => el.getAttribute('data-id'));
      try{
        await fetch(`${PRICE_API}/reorder`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order: newOrder })
        });
        // Lokale Reihenfolge synchron halten, ohne neu vom Server zu laden
        const byId = Object.fromEntries(prices.map(p => [String(p.id), p]));
        prices = newOrder.map(id => byId[id]).filter(Boolean);
      }catch(e){
        showToast('Reihenfolge konnte nicht gespeichert werden');
      }
    }
  });
}

priceSaveBtn.addEventListener('click', async () => {
  const name = priceNameEl.value.trim();
  const price = priceValueEl.value.trim();

  if(!name){
    priceNameEl.focus();
    showToast('Bitte Fisch-Namen eingeben');
    return;
  }
  if(!price){
    priceValueEl.focus();
    showToast('Bitte Preis eingeben');
    return;
  }

  await createPriceEntry(name, price);

  priceNameEl.value = '';
  priceValueEl.value = '';

  await loadPrices();
  showToast('Preis gespeichert');
});

const tabPanels = document.querySelectorAll('.tab-panel');
tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.getAttribute('data-tab');

// --- Preise aus Bild einlesen (Tesseract.js OCR) ---
const ocrUploadInput = document.getElementById('ocrUploadInput');
const ocrStatus = document.getElementById('ocrStatus');
const ocrReviewSection = document.getElementById('ocrReviewSection');
const ocrReviewList = document.getElementById('ocrReviewList');
const ocrReviewCount = document.getElementById('ocrReviewCount');
const ocrCancelBtn = document.getElementById('ocrCancelBtn');
const ocrApplyBtn = document.getElementById('ocrApplyBtn');
let ocrCandidates = [];

const OCR_IGNORE_WORDS = new Set([
  'fischmarkt','legal','illegal','fundgegenstände','fundgegenstande',
  'alle','marktpreise','items','suchen','item'
]);

ocrUploadInput.addEventListener('change', async () => {
  const file = ocrUploadInput.files[0];
  if(!file) return;

  ocrCandidates = [];
  ocrReviewSection.classList.add('hidden');
  ocrStatus.classList.remove('hidden');
  ocrStatus.textContent = '⏳ Bild wird analysiert...';

  try{
    const { data } = await Tesseract.recognize(file, 'deu', {
      logger: m => {
        if(m.status === 'recognizing text'){
          const pct = Math.round((m.progress || 0) * 100);
          ocrStatus.textContent = `⏳ Bild wird analysiert... ${pct}%`;
        }
      }
    });

    ocrCandidates = extractPriceCandidates(data.words || []);
    ocrStatus.classList.add('hidden');

    if(ocrCandidates.length === 0){
      showToast('Keine Preise im Bild erkannt — bitte anderes/schärferes Bild versuchen');
    }else{
      renderOcrReview();
    }
  }catch(e){
    console.error(e);
    ocrStatus.textContent = '❌ Fehler beim Analysieren des Bildes';
  }

  ocrUploadInput.value = '';
});

// Findet Preis-Muster ("4.358$" etc.) in den erkannten Wörtern und ordnet
// anhand der Position im Bild den davor stehenden Text als Fisch-Namen zu.
function extractPriceCandidates(words){
  const priceWords = [];

  for(let i = 0; i < words.length; i++){
    const w = words[i];
    const text = (w.text || '').trim();

    // Zahl + $-Zeichen in einem Wort, z. B. "4.358$"
    let m = text.match(/^(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?)\$$/);
    if(m){
      priceWords.push({ value: m[1] + '$', bbox: w.bbox });
      continue;
    }

    // Zahl und "$" als getrennte Wörter erkannt
    if(/^\d{1,3}(?:[.,]\d{3})*$/.test(text) && words[i+1] && (words[i+1].text || '').trim() === '$'){
      priceWords.push({ value: text + '$', bbox: w.bbox });
    }
  }

  const candidates = priceWords.map(pw => {
    const priceCenterY = (pw.bbox.y0 + pw.bbox.y1) / 2;
    const rowHeight = Math.max(pw.bbox.y1 - pw.bbox.y0, 12);

    const nameWords = words.filter(w => {
      if(!w.bbox) return false;
      const wCenterY = (w.bbox.y0 + w.bbox.y1) / 2;
      const sameRow = Math.abs(wCenterY - priceCenterY) < rowHeight * 0.9;
      const toLeft = w.bbox.x1 <= pw.bbox.x0 + 5;
      const notTooFar = (pw.bbox.x0 - w.bbox.x1) < 260;
      const cleanWord = (w.text || '').trim().toLowerCase().replace(/[^a-zäöüß]/g, '');
      const isIgnored = OCR_IGNORE_WORDS.has(cleanWord) || cleanWord.length === 0;
      return sameRow && toLeft && notTooFar && !isIgnored;
    });

    nameWords.sort((a, b) => a.bbox.x0 - b.bbox.x0);

    // Nur eine zusammenhängende Wortgruppe direkt vor dem Preis übernehmen
    // (verhindert, dass bei mehrspaltigem Grid der Name der Nachbarkarte
    // in derselben Zeile mit reingezogen wird).
    const selected = [];
    for(let i = nameWords.length - 1; i >= 0; i--){
      const w = nameWords[i];
      if(selected.length === 0){
        selected.unshift(w);
      }else{
        const gap = selected[0].bbox.x0 - w.bbox.x1;
        if(gap < 60){
          selected.unshift(w);
        }else{
          break;
        }
      }
    }

    const name = selected.map(w => (w.text || '').trim()).join(' ').trim();

    return {
      name,
      price: pw.value,
      sortKey: pw.bbox.y0 * 10000 + pw.bbox.x0
    };
  }).filter(c => c.name.length > 1);

  candidates.sort((a, b) => a.sortKey - b.sortKey);

  // Duplikate (gleicher Name + Preis, z. B. doppelt erkannt) entfernen
  const seen = new Set();
  return candidates.filter(c => {
    const key = c.name.toLowerCase() + '|' + c.price;
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function renderOcrReview(){
  if(ocrCandidates.length === 0){
    ocrReviewSection.classList.add('hidden');
    return;
  }
  ocrReviewSection.classList.remove('hidden');
  ocrReviewCount.textContent = `${ocrCandidates.length} Einträge erkannt — bitte kurz prüfen und korrigieren:`;

  ocrReviewList.innerHTML = ocrCandidates.map((c, idx) => `
    <div class="ocr-review-item">
      <input class="ocr-name-input" data-ocr-name="${idx}" value="${escapeHtml(c.name)}" placeholder="Fisch-Name" />
      <input class="ocr-price-input" data-ocr-price="${idx}" value="${escapeHtml(c.price)}" placeholder="Preis" />
      <div class="price-action-btn" data-ocr-remove="${idx}" title="Entfernen">🗑</div>
    </div>
  `).join('');

  document.querySelectorAll('[data-ocr-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = parseInt(e.currentTarget.getAttribute('data-ocr-remove'), 10);
      ocrCandidates.splice(idx, 1);
      renderOcrReview();
    });
  });
  document.querySelectorAll('[data-ocr-name]').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = parseInt(e.currentTarget.getAttribute('data-ocr-name'), 10);
      ocrCandidates[idx].name = e.currentTarget.value;
    });
  });
  document.querySelectorAll('[data-ocr-price]').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = parseInt(e.currentTarget.getAttribute('data-ocr-price'), 10);
      ocrCandidates[idx].price = e.currentTarget.value;
    });
  });
}

ocrCancelBtn.addEventListener('click', () => {
  ocrCandidates = [];
  ocrReviewSection.classList.add('hidden');
});

ocrApplyBtn.addEventListener('click', async () => {
  let created = 0;
  let updated = 0;

  for(const c of ocrCandidates){
    const name = (c.name || '').trim();
    const price = (c.price || '').trim();
    if(!name || !price) continue;

    const existing = prices.find(p => p.name.trim().toLowerCase() === name.toLowerCase());
    if(existing){
      await updatePriceValue(existing.id, price);
      updated++;
    }else{
      await createPriceEntry(name, price);
      created++;
    }
  }

  ocrCandidates = [];
  ocrReviewSection.classList.add('hidden');
  await loadPrices();
  showToast(`✅ ${created} neu, ${updated} aktualisiert`);
});

// --- Passwortsperre ---
const APP_PASSWORD = "AngelSpotRetroRP";
const lockScreen = document.getElementById('lockScreen');
const appEl = document.getElementById('app');
const pwInput = document.getElementById('pw');
const pwBtn = document.getElementById('pwBtn');
const pwError = document.getElementById('pwError');

function unlock(){
  lockScreen.classList.add('hidden');
  appEl.classList.remove('hidden');
  sessionStorage.setItem('angel-unlocked', '1');
  loadSpots();
  loadPrices();
}

function tryUnlock(){
  if(pwInput.value === APP_PASSWORD){
    pwError.textContent = '';
    unlock();
  }else{
    pwError.textContent = 'Falsches Passwort';
    pwInput.value = '';
    pwInput.focus();
  }
}

pwBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') tryUnlock();
});

if(sessionStorage.getItem('angel-unlocked') === '1'){
  unlock();
}else{
  pwInput.focus();
}
