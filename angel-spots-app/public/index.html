<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Illegale Angel-Spots</title>
<style>
  :root{
    --bg: #0a0d14;
    --panel: #0f1420;
    --panel-border: #3a1414;
    --input-bg: #131a2c;
    --input-border: #1f2942;
    --text: #f2f3f5;
    --text-dim: #8b93a7;
    --accent: #e5484d;
    --accent-hover: #f0616a;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  .eyebrow{
    color: var(--accent);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1{
    font-size: 26px;
    margin: 0 0 20px 0;
    font-weight: 800;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .card-title .plus{
    color: var(--accent);
    font-weight: 800;
  }
  input{
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
    transition: border-color .15s ease;
  }
  input::placeholder{ color: var(--text-dim); }
  input:focus{ border-color: var(--accent); }
  .row2{
    display:flex;
    gap: 12px;
  }
  .row2 input{ flex:1; margin-bottom: 0; }
  .row2{ margin-bottom: 12px; }
  button.save{
    width: 100%;
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 700;
    font-size: 14px;
    padding: 13px 14px;
    border-radius: 8px;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: background .15s ease;
    margin-top: 4px;
  }
  button.save:hover{ background: var(--accent-hover); }

  .spot{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .spot-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .spot-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .3px;
  }
  .del{
    background: rgba(229,72,77,0.15);
    border: 1px solid rgba(229,72,77,0.3);
    color: var(--accent);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .del:hover{ background: rgba(229,72,77,0.3); }
  .del.small{
    width: 26px;
    height: 26px;
    font-size: 12px;
  }
  .stat{
    display:flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
  }
  .stat-label{ color: var(--text-dim); }
  .stat-value{ font-weight: 700; }

  .fish-section{
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--panel-border);
  }
  .fish-label{
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .fish-item{
    display:flex;
    align-items:center;
    justify-content: space-between;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .fish-item .fname{ font-weight: 700; }
  .fish-item .fpercent{ color: var(--accent); font-weight: 800; }
  .fish-item .ftime{ color: var(--text-dim); margin-left: 10px; font-size: 12px; }
  .fish-item-left{ display:flex; align-items:baseline; gap: 4px; flex-wrap: wrap; }
  .fish-empty{
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 10px;
  }
  .fish-add-row{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .fish-add-row input{
    margin-bottom: 0;
    font-size: 13px;
    padding: 10px 12px;
  }
  .fish-add-row .fname-input{ flex: 1 1 100%; }
  .fish-add-row .fpercent-input{ flex: 1 1 calc(50% - 44px); min-width: 90px; }
  .fish-add-row .ftime-input{ flex: 1 1 calc(50% - 44px); min-width: 90px; }
  .fish-add-btn{
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
    width: 40px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .fish-add-btn:hover{ background: var(--accent-hover); }

  .empty{
    text-align:center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 30px 0;
  }
  .toast{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .toast.show{ opacity: 1; }

  .lock-screen{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  .lock-box{
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 28px;
    text-align:center;
  }
  .lock-icon{ font-size: 32px; margin-bottom: 10px; }
  .lock-title{ font-weight: 800; font-size: 18px; margin-bottom: 4px; }
  .lock-sub{ color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }
  .lock-error{
    color: var(--accent);
    font-size: 12px;
    min-height: 16px;
    margin: -6px 0 8px;
  }
  .hidden{ display: none !important; }

  .map-upload-label{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width: 100%;
    background: var(--input-bg);
    border: 1px dashed var(--input-border);
    border-radius: 8px;
    color: var(--text-dim);
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    transition: border-color .15s ease, color .15s ease;
  }
  .map-upload-label:hover{ border-color: var(--accent); color: var(--text); }
  .map-upload-label input[type="file"]{ display:none; }

  .map-preview{
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
    display: block;
  }

  .map-section{
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--panel-border);
  }
  .map-label{
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .map-img-wrap{
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    cursor: zoom-in;
  }
  .map-img-wrap img{
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display:block;
    border-radius: 8px;
  }
  .map-remove{
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(10,13,20,0.75);
    border: 1px solid var(--panel-border);
    color: var(--accent);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    font-size: 12px;
  }
  .map-remove:hover{ background: rgba(229,72,77,0.25); }
  .map-upload-small{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width: 100%;
    background: var(--input-bg);
    border: 1px dashed var(--input-border);
    border-radius: 8px;
    color: var(--text-dim);
    padding: 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .map-upload-small:hover{ border-color: var(--accent); color: var(--text); }
  .map-upload-small input[type="file"]{ display:none; }

  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 100;
    cursor: zoom-out;
  }
  .lightbox img{
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
  }

  .price-item{
    display:flex;
    align-items:center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  .price-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight: 700;
    font-size: 14px;
  }
  .price-value{
    font-weight: 800;
    color: var(--accent);
    font-size: 15px;
    margin-right: 14px;
  }
  .price-row-right{
    display:flex;
    align-items:center;
  }

  .tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 5px;
  }
  .tab-btn{
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn:hover{ color: var(--text); }
  .tab-btn.active{
    background: var(--accent);
    color: white;
  }
  .tab-panel{ display: none; }
  .tab-panel.active{ display: block; }

  .gold-banner{
    display:flex;
    align-items:center;
    gap: 12px;
    background: linear-gradient(135deg, #b8860b, #f5c542 45%, #d4a017 55%, #f7d774);
    background-size: 200% 200%;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    color: #241800;
    box-shadow: 0 0 16px rgba(245,197,66,0.35);
  }
  .gold-banner.active{
    animation: goldPulse 2.2s ease-in-out infinite, goldShift 6s ease infinite;
  }
  @keyframes goldPulse{
    0%, 100%{ box-shadow: 0 0 14px rgba(245,197,66,0.4); }
    50%{ box-shadow: 0 0 32px rgba(245,197,66,0.85); }
  }
  @keyframes goldShift{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }
  .gold-banner-icon{
    font-size: 22px;
    flex-shrink: 0;
  }
  .gold-banner-text{
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
  }
  .gold-banner-text strong{
    font-weight: 800;
  }
</style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Zugriff gesperrt</div>
    <div class="lock-sub">Passwort eingeben, um fortzufahren</div>
    <input id="pw" type="password" placeholder="Passwort" />
    <div class="lock-error" id="pwError"></div>
    <button class="save" id="pwBtn">Entsperren</button>
  </div>
</div>

<div class="wrap hidden" id="app">
  <div class="gold-banner hidden" id="goldBanner">
    <div class="gold-banner-icon">⭐</div>
    <div class="gold-banner-text" id="goldBannerText"></div>
  </div>

  <div class="eyebrow">Schmugglerbuchten</div>
  <h1>Illegale Angel-Spots</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnSpots" data-tab="spots">🐟 Spots</button>
    <button class="tab-btn" id="tabBtnPrices" data-tab="prices">💰 Preisliste</button>
  </div>

  <div class="tab-panel active" id="tabSpots">
    <div class="card">
      <div class="card-title"><span class="plus">+</span> Neuen Spot hinzufügen</div>
      <input id="name" placeholder="Spot-Name" />
      <div class="row2">
        <input id="level" placeholder="Level-Bereich (z. B. 1 - 40)" />
        <input id="time" placeholder="Uhrzeit (z. B. 16:00 Uhr)" />
      </div>
      <input id="golden" placeholder="Goldene Stunde (z. B. 02 - 03 Uhr)" />

      <label class="map-upload-label" id="mapUploadLabel">
        <span id="mapUploadText">🗺️ GTA5-Karte hinzufügen (optional)</span>
        <input type="file" id="mapInput" accept="image/*" />
      </label>
      <img id="mapPreview" class="map-preview hidden" />

      <button class="save" id="saveBtn">+ Spot speichern</button>
    </div>

    <div id="list"></div>
  </div>

  <div class="tab-panel" id="tabPrices">
    <div class="card">
      <div class="card-title"><span class="plus">+</span> Fisch zur Preisliste hinzufügen</div>
      <div class="row2">
        <input id="priceName" placeholder="Fisch-Name (z. B. Lachs)" />
        <input id="priceValue" placeholder="Preis (z. B. 250$)" />
      </div>
      <button class="save" id="priceSaveBtn">+ Preis speichern</button>
    </div>

    <div id="priceList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="lightbox" class="lightbox hidden"><img id="lightboxImg" /></div>

<script>
const API = '/api/spots';

const nameEl = document.getElementById('name');
const levelEl = document.getElementById('level');
const timeEl = document.getElementById('time');
const goldenEl = document.getElementById('golden');
const saveBtn = document.getElementById('saveBtn');
const listEl = document.getElementById('list');
const toastEl = document.getElementById('toast');
const mapInput = document.getElementById('mapInput');
const mapPreview = document.getElementById('mapPreview');
const mapUploadText = document.getElementById('mapUploadText');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

let spots = [];
let pendingMapImage = null;

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1800);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

mapInput.addEventListener('change', async () => {
  const file = mapInput.files[0];
  if(!file) return;
  try{
    pendingMapImage = await readFileAsDataUrl(file);
    mapPreview.src = pendingMapImage;
    mapPreview.classList.remove('hidden');
    mapUploadText.textContent = '🗺️ Bild ausgewählt — Klicken zum Ändern';
  }catch(e){
    showToast('Bild konnte nicht geladen werden');
  }
});

function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.remove('hidden');
}
lightbox.addEventListener('click', () => {
  lightbox.classList.add('hidden');
  lightboxImg.src = '';
});

// --- Goldene Stunde: Berechnung & Anzeige ---
const goldBanner = document.getElementById('goldBanner');
const goldBannerText = document.getElementById('goldBannerText');

// Extrahiert Start-/Endzeit aus Texten wie "02 - 03 Uhr" oder "22:30 - 23:00"
function parseGoldenWindow(str){
  if(!str) return null;
  const matches = str.match(/(\d{1,2})(?::(\d{2}))?/g);
  if(!matches || matches.length < 2) return null;
  const parseTok = (tok) => {
    const parts = tok.split(':');
    const h = parseInt(parts[0], 10) % 24;
    const m = parts[1] ? parseInt(parts[1], 10) : 0;
    if(isNaN(h) || isNaN(m)) return null;
    return { h, m };
  };
  const start = parseTok(matches[0]);
  const end = parseTok(matches[1]);
  if(!start || !end) return null;
  return { startH: start.h, startM: start.m, endH: end.h, endM: end.m };
}

function formatWindow(win){
  const pad = n => String(n).padStart(2, '0');
  return `${pad(win.startH)}:${pad(win.startM)} - ${pad(win.endH)}:${pad(win.endM)} Uhr`;
}

function formatMinutes(mins){
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}min` : `${m}min`;
}

function updateGoldBanner(){
  if(!spots || spots.length === 0){
    goldBanner.classList.add('hidden');
    return;
  }

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const activeSpots = [];
  const upcoming = [];

  spots.forEach(spot => {
    const win = parseGoldenWindow(spot.golden);
    if(!win) return;

    const startMin = win.startH * 60 + win.startM;
    const endMin = win.endH * 60 + win.endM;
    const wrapsMidnight = endMin <= startMin;

    let isActive = false;
    let minutesUntilEnd = 0;
    let minutesUntilStart = 0;

    if(wrapsMidnight){
      isActive = nowMin >= startMin || nowMin < endMin;
      if(isActive){
        minutesUntilEnd = nowMin >= startMin ? (endMin + 1440 - nowMin) : (endMin - nowMin);
      }else{
        minutesUntilStart = startMin - nowMin;
        if(minutesUntilStart < 0) minutesUntilStart += 1440;
      }
    }else{
      isActive = nowMin >= startMin && nowMin < endMin;
      if(isActive){
        minutesUntilEnd = endMin - nowMin;
      }else{
        minutesUntilStart = startMin - nowMin;
        if(minutesUntilStart < 0) minutesUntilStart += 1440;
      }
    }

    if(isActive){
      activeSpots.push({ spot, minutesUntilEnd });
    }else{
      upcoming.push({ spot, minutesUntilStart, win });
    }
  });

  if(activeSpots.length > 0){
    goldBanner.classList.remove('hidden');
    goldBanner.classList.add('active');
    const names = activeSpots.map(a => escapeHtml(a.spot.name)).join(', ');
    const soonestEnd = Math.min(...activeSpots.map(a => a.minutesUntilEnd));
    goldBannerText.innerHTML = `<strong>🌟 GOLDENE STUNDE AKTIV:</strong> ${names} — noch ${formatMinutes(soonestEnd)}`;
  }else if(upcoming.length > 0){
    goldBanner.classList.remove('hidden');
    goldBanner.classList.remove('active');
    upcoming.sort((a, b) => a.minutesUntilStart - b.minutesUntilStart);
    const next = upcoming[0];
    goldBannerText.innerHTML = `<strong>⏳ Nächste Goldene Stunde:</strong> ${escapeHtml(next.spot.name)} in ${formatMinutes(next.minutesUntilStart)} (${formatWindow(next.win)})`;
  }else{
    goldBanner.classList.add('hidden');
  }
}

// Timer alle 30 Sekunden aktualisieren (ohne neu vom Server zu laden)
setInterval(updateGoldBanner, 30000);

// --- API-Kommunikation ---
async function loadSpots(){
  try{
    const res = await fetch(API);
    spots = await res.json();
  }catch(e){
    showToast('Server nicht erreichbar');
    spots = [];
  }
  render();
  updateGoldBanner();
}

async function createSpot(payload){
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

async function deleteSpot(id){
  await fetch(`${API}/${id}`, { method: 'DELETE' });
}

async function setSpotMap(id, mapImage){
  await fetch(`${API}/${id}/map`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mapImage })
  });
}

async function addFish(spotId, name, time, percent){
  await fetch(`${API}/${spotId}/fish`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, time, percent })
  });
}

async function deleteFish(spotId, fishId){
  await fetch(`${API}/${spotId}/fish/${fishId}`, { method: 'DELETE' });
}

// --- Rendering ---
function render(){
  listEl.innerHTML = '';
  if(spots.length === 0){
    listEl.innerHTML = '<div class="empty">Noch keine Spots eingetragen.</div>';
    return;
  }

  spots.forEach(spot => {
    const div = document.createElement('div');
    div.className = 'spot';

    const formatPercent = (val) => {
      if(!val) return '';
      const num = parseFloat(String(val).replace(',', '.').replace('%', ''));
      if(isNaN(num)) return escapeHtml(val);
      return num.toFixed(2).replace('.', ',') + ' %';
    };

    const fishItemsHtml = spot.fish.length === 0
      ? '<div class="fish-empty">Noch keine Fische eingetragen.</div>'
      : spot.fish.map(f => `
          <div class="fish-item">
            <div class="fish-item-left">
              <span class="fname">${escapeHtml(f.name)}</span>
              ${f.percent ? `<span class="fpercent"> - ${formatPercent(f.percent)}</span>` : ''}
              ${f.time ? `<span class="ftime">${escapeHtml(f.time)}</span>` : ''}
            </div>
            <div class="del small" data-spot="${spot.id}" data-fish="${f.id}">🗑</div>
          </div>
        `).join('');

    const mapHtml = spot.mapImage
      ? `<div class="map-img-wrap" data-view-map="${spot.id}">
           <img src="${spot.mapImage}" />
           <div class="map-remove" data-remove-map="${spot.id}">🗑</div>
         </div>`
      : `<label class="map-upload-small">
           🗺️ Karte hinzufügen
           <input type="file" accept="image/*" data-addmap="${spot.id}" />
         </label>`;

    div.innerHTML = `
      <div class="spot-head">
        <div class="spot-name">🐟 ${escapeHtml(spot.name).toUpperCase()}</div>
        <div class="del" data-id="${spot.id}">🗑</div>
      </div>
      <div class="stat"><span class="stat-label">Level-Bereich</span><span class="stat-value">${escapeHtml(spot.level)}</span></div>
      <div class="stat"><span class="stat-label">Uhrzeit</span><span class="stat-value">${escapeHtml(spot.time)}</span></div>
      <div class="stat"><span class="stat-label">Goldene Stunde</span><span class="stat-value">${escapeHtml(spot.golden)}</span></div>

      <div class="map-section">
        <div class="map-label">🗺️ GTA5-Karte</div>
        ${mapHtml}
      </div>

      <div class="fish-section">
        <div class="fish-label">🐠 Fische</div>
        ${fishItemsHtml}
        <div class="fish-add-row">
          <input class="fname-input" placeholder="Fisch (z. B. Barsch)" data-fname="${spot.id}" />
          <input class="fpercent-input" placeholder="Prozent (z. B. 16,13%)" data-fpercent="${spot.id}" />
          <input class="ftime-input" placeholder="Zeit (optional)" data-ftime="${spot.id}" />
          <button class="fish-add-btn" data-addfish="${spot.id}">+</button>
        </div>
      </div>
    `;
    listEl.appendChild(div);
  });

  // Spot löschen
  document.querySelectorAll('.del[data-id]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.currentTarget.getAttribute('data-id');
      await deleteSpot(id);
      await loadSpots();
      showToast('Spot gelöscht');
    });
  });

  // Fisch löschen
  document.querySelectorAll('.del[data-fish]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const spotId = e.currentTarget.getAttribute('data-spot');
      const fishId = e.currentTarget.getAttribute('data-fish');
      await deleteFish(spotId, fishId);
      await loadSpots();
      showToast('Fisch gelöscht');
    });
  });

  // Fisch hinzufügen
  document.querySelectorAll('[data-addfish]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const spotId = e.currentTarget.getAttribute('data-addfish');
      const fnameInput = document.querySelector(`[data-fname="${spotId}"]`);
      const fpercentInput = document.querySelector(`[data-fpercent="${spotId}"]`);
      const ftimeInput = document.querySelector(`[data-ftime="${spotId}"]`);
      const fname = fnameInput.value.trim();
      const fpercent = fpercentInput.value.trim();
      const ftime = ftimeInput.value.trim();

      if(!fname){
        fnameInput.focus();
        showToast('Bitte Fisch-Namen eingeben');
        return;
      }

      await addFish(spotId, fname, ftime, fpercent);
      await loadSpots();
      showToast('Fisch gespeichert');
    });
  });

  // Kartenbild bei bestehendem Spot hinzufügen
  document.querySelectorAll('[data-addmap]').forEach(input => {
    input.addEventListener('change', async (e) => {
      const spotId = e.currentTarget.getAttribute('data-addmap');
      const file = e.currentTarget.files[0];
      if(!file) return;
      try{
        const dataUrl = await readFileAsDataUrl(file);
        await setSpotMap(spotId, dataUrl);
        await loadSpots();
        showToast('Karte gespeichert');
      }catch(err){
        showToast('Bild konnte nicht geladen werden');
      }
    });
  });

  // Kartenbild entfernen
  document.querySelectorAll('[data-remove-map]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const spotId = e.currentTarget.getAttribute('data-remove-map');
      await setSpotMap(spotId, null);
      await loadSpots();
      showToast('Karte entfernt');
    });
  });

  // Kartenbild vergrößern
  document.querySelectorAll('[data-view-map]').forEach(wrap => {
    wrap.addEventListener('click', (e) => {
      const img = wrap.querySelector('img');
      if(img) openLightbox(img.src);
    });
  });
}

saveBtn.addEventListener('click', async () => {
  const name = nameEl.value.trim();
  const level = levelEl.value.trim();
  const time = timeEl.value.trim();
  const golden = goldenEl.value.trim();

  if(!name){
    nameEl.focus();
    showToast('Bitte Spot-Namen eingeben');
    return;
  }

  await createSpot({ name, level, time, golden, mapImage: pendingMapImage });

  nameEl.value = '';
  levelEl.value = '';
  timeEl.value = '';
  goldenEl.value = '';
  mapInput.value = '';
  pendingMapImage = null;
  mapPreview.classList.add('hidden');
  mapPreview.src = '';
  mapUploadText.textContent = '🗺️ GTA5-Karte hinzufügen (optional)';

  await loadSpots();
  showToast('Spot gespeichert');
});

// --- Preisliste ---
const PRICE_API = '/api/prices';
const priceNameEl = document.getElementById('priceName');
const priceValueEl = document.getElementById('priceValue');
const priceSaveBtn = document.getElementById('priceSaveBtn');
const priceListEl = document.getElementById('priceList');
let prices = [];

async function loadPrices(){
  try{
    const res = await fetch(PRICE_API);
    prices = await res.json();
  }catch(e){
    prices = [];
  }
  renderPrices();
}

function renderPrices(){
  priceListEl.innerHTML = '';
  if(prices.length === 0){
    priceListEl.innerHTML = '<div class="empty">Noch keine Preise eingetragen.</div>';
    return;
  }
  prices.forEach(p => {
    const div = document.createElement('div');
    div.className = 'price-item';
    div.innerHTML = `
      <div class="price-name">🐟 ${escapeHtml(p.name)}</div>
      <div class="price-row-right">
        <div class="price-value">${escapeHtml(p.price)}</div>
        <div class="del small" data-priceid="${p.id}">🗑</div>
      </div>
    `;
    priceListEl.appendChild(div);
  });

  document.querySelectorAll('[data-priceid]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.currentTarget.getAttribute('data-priceid');
      await fetch(`${PRICE_API}/${id}`, { method: 'DELETE' });
      await loadPrices();
      showToast('Preis gelöscht');
    });
  });
}

priceSaveBtn.addEventListener('click', async () => {
  const name = priceNameEl.value.trim();
  const price = priceValueEl.value.trim();

  if(!name){
    priceNameEl.focus();
    showToast('Bitte Fisch-Namen eingeben');
    return;
  }
  if(!price){
    priceValueEl.focus();
    showToast('Bitte Preis eingeben');
    return;
  }

  await fetch(PRICE_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, price })
  });

  priceNameEl.value = '';
  priceValueEl.value = '';

  await loadPrices();
  showToast('Preis gespeichert');
});

// --- Tabs ---
const tabBtns = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');
tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.getAttribute('data-tab');
    tabBtns.forEach(b => b.classList.toggle('active', b === btn));
    tabPanels.forEach(p => p.classList.toggle('active', p.id === 'tab' + target.charAt(0).toUpperCase() + target.slice(1)));
  });
});

// --- Passwortsperre ---
const APP_PASSWORD = "AngelSpotRetroRP";
const lockScreen = document.getElementById('lockScreen');
const appEl = document.getElementById('app');
const pwInput = document.getElementById('pw');
const pwBtn = document.getElementById('pwBtn');
const pwError = document.getElementById('pwError');

function unlock(){
  lockScreen.classList.add('hidden');
  appEl.classList.remove('hidden');
  sessionStorage.setItem('angel-unlocked', '1');
  loadSpots();
  loadPrices();
}

function tryUnlock(){
  if(pwInput.value === APP_PASSWORD){
    pwError.textContent = '';
    unlock();
  }else{
    pwError.textContent = 'Falsches Passwort';
    pwInput.value = '';
    pwInput.focus();
  }
}

pwBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') tryUnlock();
});

if(sessionStorage.getItem('angel-unlocked') === '1'){
  unlock();
}else{
  pwInput.focus();
}
</script>
